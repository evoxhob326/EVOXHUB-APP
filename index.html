<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVOXHUB – إدارة الفريق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0b4f4f;--g2:#0e6464;--gold:#c9a227;--bg:#f4f6f6;--txt:#1d2b2b;--mut:#6b7a7a;--red:#b3261e}
*{box-sizing:border-box;font-family:Tajawal,sans-serif}
body{margin:0;background:var(--bg);color:var(--txt)}
header{background:var(--g);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;font-size:22px;letter-spacing:1px;direction:ltr}.logo b{color:var(--gold)}
main{max-width:1000px;margin:auto;padding:16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
h2{margin:0 0 12px;font-size:18px;color:var(--g)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd8d8;border-radius:9px;margin-bottom:8px;font-size:15px}
button{background:var(--g);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer}
button.gold{background:var(--gold);color:#1d2b2b}button.ghost{background:transparent;border:1px solid #fff}
button.red{background:var(--red)}button.sm{padding:5px 9px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#dfe7e7;color:var(--g)}.tabs button.on{background:var(--g);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.task{border-right:4px solid var(--g2);padding:10px;border-radius:9px;background:#fafcfc;margin-bottom:8px}
.task.overdue{border-color:var(--red)}.task.done{border-color:#2e7d32;opacity:.75}
.meta{color:var(--mut);font-size:13px}.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#e7efef;font-size:12px;margin-left:4px}
.err{color:var(--red);font-size:14px}.hide{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--g);color:#fff;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px;color:var(--gold)}
</style>
</head>
<body>
<header><div class="logo">EVO<b>X</b>HUB</div><div id="who"></div></header>
<main id="app"></main>
<script>
const sb = supabase.createClient('https://erjmcyshsdxdlhkrwqbh.supabase.co','sb_publishable_YnuXveVpNwqjVgARat4acA_1-ZmyPH9');
const ST={not_started:'لم تبدأ',in_progress:'قيد التنفيذ',awaiting_approval:'بانتظار الموافقة',overdue:'متأخرة',done:'مكتملة'};
const RL={owner:'المالك',deputy:'نائب',employee:'موظف/ة'};
const PR={1:'عالية',2:'متوسطة',3:'منخفضة'};
let me=null, projects=[], people=[], tab='tasks', filter='all';
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return loginView();
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
  me=data;
  $('#who').innerHTML=`<span>${esc(me?.full_name)} · ${RL[me?.role]||''}</span> <button class="ghost sm" onclick="logout()">خروج</button>`;
  if(!me||me.status!=='active') return app.innerHTML=`<div class="card"><h2>بانتظار الموافقة</h2><p>تم تسجيل حسابك. سيتم تفعيله بعد موافقة الإدارة.</p></div>`;
  projects=(await sb.from('projects').select('*').order('name')).data||[];
  if(isMgr()) people=(await sb.from('profiles').select('*').order('created_at')).data||[];
  render();
}
const isMgr=()=>me&&['owner','deputy'].includes(me.role);

function loginView(mode='in'){
  $('#who').innerHTML='';
  app.innerHTML=`<div class="card" style="max-width:420px;margin:40px auto">
  <h2>${mode==='in'?'تسجيل الدخول':'حساب جديد للفريق'}</h2>
  ${mode==='up'?'<input id="nm" placeholder="الاسم الكامل">':''}
  <input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
  <input id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" dir="ltr">
  <button onclick="${mode==='in'?'login()':'signup()'}" style="width:100%">${mode==='in'?'دخول':'إنشاء الحساب'}</button>
  <p class="err" id="er"></p>
  <p class="meta" style="text-align:center"><a href="#" onclick="loginView('${mode==='in'?'up':'in'}');return false">${mode==='in'?'موظف جديد؟ أنشئ حسابك':'عندك حساب؟ سجّل دخولك'}</a></p></div>`;
}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?$('#er').textContent='بيانات الدخول غير صحيحة':init();}
async function signup(){
  const {data,error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value,options:{data:{full_name:$('#nm').value.trim()}}});
  if(error) return $('#er').textContent=error.message;
  data.session?init():app.innerHTML='<div class="card"><h2>تم التسجيل</h2><p>افتح بريدك لتأكيد الحساب، ثم انتظر موافقة الإدارة.</p></div>';
}
async function logout(){await sb.auth.signOut();me=null;loginView();}

async function render(){
  const tabs=isMgr()?[['tasks','المهام'],['new','مهمة جديدة'],['team','الفريق'],['dash','لوحة الإدارة']]:[['tasks','مهامي']];
  app.innerHTML=`<div class="tabs">${tabs.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div><div id="v"></div>`;
  ({tasks:tasksView,new:newView,team:teamView,dash:dashView})[tab]();
}

async function loadTasks(){
  let q=sb.from('tasks').select('*').order('due_date',{ascending:true,nullsFirst:false});
  const {data}=await q; const t=data||[];
  t.forEach(x=>{if(x.status!=='done'&&x.due_date&&x.due_date<today())x._late=true});
  return t;
}
const pname=id=>projects.find(p=>p.id===id)?.name||'—';
const uname=id=>people.find(p=>p.id===id)?.full_name||(id===me.id?me.full_name:'—');

async function tasksView(){
  const v=$('#v'); v.innerHTML='<div class="card">جاري التحميل…</div>';
  let t=await loadTasks();
  const f=`<div class="row" style="margin-bottom:8px"><select onchange="filter=this.value;tasksView()">
    <option value="all">كل المشاريع</option>${projects.map(p=>`<option value="${p.id}" ${filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`;
  if(filter!=='all') t=t.filter(x=>x.project_id===filter);
  v.innerHTML=`<div class="card"><h2>${isMgr()?'كل المهام':'مهامي'} (${t.length})</h2>${f}${t.map(taskHtml).join('')||'<p class="meta">لا توجد مهام</p>'}</div>`;
}
function taskHtml(x){
  const st=x._late?'overdue':x.status;
  return `<div class="task ${st}"><b>${esc(x.title)}</b>
  <div class="meta"><span class="pill">${esc(pname(x.project_id))}</span>${isMgr()?`<span class="pill">👤 ${esc(uname(x.assigned_to))}</span>`:''}
  <span class="pill">أولوية ${PR[x.priority]}</span>${x.due_date?`<span class="pill">📅 ${x.due_date}</span>`:''}${x._late?'<span class="pill" style="color:#b3261e">متأخرة</span>':''}</div>
  ${x.description?`<p style="margin:6px 0">${esc(x.description)}</p>`:''}
  <div class="row" style="margin-top:6px"><select onchange="setStatus('${x.id}',this.value)">${Object.entries(ST).filter(([k])=>isMgr()||k!=='done').map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select>
  ${me.role==='owner'?`<button class="red sm" style="flex:0" onclick="delTask('${x.id}')">حذف</button>`:''}</div></div>`;
}
async function setStatus(id,s){const {error}=await sb.from('tasks').update({status:s}).eq('id',id);if(error)alertBox(error.message);else tasksView();}
async function delTask(id){if(!await confirmBox('حذف المهمة نهائيًا؟'))return;await sb.from('tasks').delete().eq('id',id);tasksView();}

function newView(){
  const act=people.filter(p=>p.status==='active');
  $('#v').innerHTML=`<div class="card"><h2>مهمة جديدة</h2>
  <input id="tt" placeholder="عنوان المهمة"><textarea id="td" rows="3" placeholder="التفاصيل (اختياري)"></textarea>
  <div class="row"><select id="tp">${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
  <select id="ta"><option value="">— اختر الموظف/ة —</option>${act.map(p=>`<option value="${p.id}">${esc(p.full_name)}</option>`).join('')}</select></div>
  <div class="row"><select id="tr"><option value="1">أولوية عالية</option><option value="2" selected>متوسطة</option><option value="3">منخفضة</option></select><input id="tdd" type="date"></div>
  <button class="gold" onclick="addTask()">إضافة المهمة</button><p class="err" id="er"></p></div>`;
}
async function addTask(){
  const title=$('#tt').value.trim(); if(!title) return $('#er').textContent='اكتب عنوان المهمة';
  const {error}=await sb.from('tasks').insert({title,description:$('#td').value.trim()||null,project_id:$('#tp').value,assigned_to:$('#ta').value||null,priority:+$('#tr').value,due_date:$('#tdd').value||null});
  if(error) return $('#er').textContent=error.message; tab='tasks'; render();
}

function teamView(){
  const pend=people.filter(p=>p.status==='pending'), rest=people.filter(p=>p.status!=='pending');
  const own=me.role==='owner';
  $('#v').innerHTML=`<div class="card"><h2>طلبات الانضمام (${pend.length})</h2>
  ${pend.map(p=>`<div class="task"><b>${esc(p.full_name)}</b><div class="row" style="margin-top:6px"><button onclick="setMember('${p.id}',{status:'active'})">قبول</button><button class="red" onclick="setMember('${p.id}',{status:'disabled'})">رفض</button></div></div>`).join('')||'<p class="meta">لا توجد طلبات</p>'}</div>
  <div class="card"><h2>الفريق (${rest.length})</h2>
  ${rest.map(p=>`<div class="task"><b>${esc(p.full_name)}</b> <span class="pill">${RL[p.role]}</span><span class="pill">${p.status==='active'?'مفعّل':'موقوف'}</span>
  ${own&&p.id!==me.id?`<div class="row" style="margin-top:6px"><select onchange="setMember('${p.id}',{role:this.value})">${['employee','deputy'].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${RL[r]}</option>`).join('')}</select>
  <button class="${p.status==='active'?'red':''} sm" onclick="setMember('${p.id}',{status:'${p.status==='active'?'disabled':'active'}'})">${p.status==='active'?'إيقاف':'تفعيل'}</button></div>`:''}</div>`).join('')}</div>`;
}
async function setMember(id,ch){const {error}=await sb.from('profiles').update(ch).eq('id',id);if(error)return alertBox(error.message);people=(await sb.from('profiles').select('*').order('created_at')).data||[];teamView();}

async function dashView(){
  const t=await loadTasks(); const c=k=>t.filter(x=>k==='overdue'?x._late:(x.status===k&&!x._late)).length;
  const byP=projects.map(p=>[p.name,t.filter(x=>x.project_id===p.id&&x.status!=='done').length]);
  const byU=people.filter(p=>p.status==='active').map(p=>[p.full_name,t.filter(x=>x.assigned_to===p.id&&x.status!=='done').length,t.filter(x=>x.assigned_to===p.id&&x._late).length]);
  $('#v').innerHTML=`<div class="card"><h2>نظرة عامة</h2><div class="stats">${Object.entries(ST).map(([k,v])=>`<div class="stat"><b>${c(k)}</b>${v}</div>`).join('')}</div></div>
  <div class="card"><h2>المهام المفتوحة حسب المشروع</h2>${byP.map(([n,k])=>`<div class="meta">${esc(n)}: <b>${k}</b></div>`).join('')}</div>
  <div class="card"><h2>حسب الموظف/ة</h2>${byU.map(([n,o,l])=>`<div class="meta">${esc(n)}: مفتوحة <b>${o}</b> · متأخرة <b style="color:#b3261e">${l}</b></div>`).join('')}</div>`;
}

function alertBox(m){const d=document.createElement('div');d.className='card';d.style.cssText='position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;border:2px solid #b3261e;z-index:9';d.innerHTML=esc(m);document.body.append(d);setTimeout(()=>d.remove(),4000);}
function confirmBox(m){return new Promise(r=>{const d=document.createElement('div');d.className='card';d.style.cssText='position:fixed;top:30%;left:16px;right:16px;max-width:360px;margin:auto;z-index:9;box-shadow:0 4px 30px #0004';d.innerHTML=`<p>${esc(m)}</p><div class="row"><button class="red">نعم</button><button>إلغاء</button></div>`;document.body.append(d);const[b1,b2]=d.querySelectorAll('button');b1.onclick=()=>{d.remove();r(true)};b2.onclick=()=>{d.remove();r(false)};});}

sb.auth.onAuthStateChange((e)=>{if(e==='SIGNED_OUT')loginView();});
init();
</script>
</body>
</html>
